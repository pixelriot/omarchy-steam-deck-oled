# Drop plymouth from the initramfs and slot buffyboard in before encrypt.
_deck_hooks=()
for _deck_h in "${HOOKS[@]}"; do
    if [ "$_deck_h" = "plymouth" ]; then
        continue
    fi
    if [ "$_deck_h" = "encrypt" ]; then
        _deck_hooks+=(buffyboard)
    fi
    _deck_hooks+=("$_deck_h")
done
HOOKS=("${_deck_hooks[@]}")
unset _deck_hooks _deck_h
